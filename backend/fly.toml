app = "backend-lingering-pine-7093"  # your Fly.io app name
primary_region = "sea"

[build]

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Liveness check only: /api/live returns 200 with zero dependency probes,
  # so a vendor hiccup (AWS/OpenAI/Firebase) can't fail the machine check or
  # burn quota every interval. Dependency status lives at /api/health.
  # grace_period is generous because startup initializes AWS/OpenAI/Firebase
  # clients before the app can serve requests.
  [[services.http_checks]]
    interval = "15s"
    grace_period = "30s"
    method = "GET"
    path = "/api/live"
    timeout = "5s"

[env]
  # optional: if you want a fallback
  PORT = "8080"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
